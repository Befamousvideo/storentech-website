# Firebase App Hosting — Cloud Run in us-west1 (set the backend region in Firebase).
# https://firebase.google.com/docs/app-hosting

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://storentech.com
    availability:
      - BUILD
      - RUNTIME
  # Set INQUIRY_WEBHOOK_URL as a secret in the App Hosting backend, not in this file.
